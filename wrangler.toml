name = "seadex-telegram-bot-serverless"
main = "src/worker.ts"
compatibility_date = "2026-08-06"

[triggers]
# Detection latency is bounded by this interval: SeaDex changes are only seen by
# the next tick, so a five-minute schedule adds up to five minutes of lag on top
# of the sync itself. One minute matches the previous always-on deployment while
# the probe below keeps the per-tick upstream cost small.
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "seadex"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "seadex-sync"

[[queues.consumers]]
queue = "seadex-sync"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 1
max_retries = 5
dead_letter_queue = "seadex-sync-dlq"

[vars]
SEADEX_API_URL = "https://seadex.moe/api/collections"

[[ratelimits]]
name = "PUBLIC_API_RATE_LIMITER"
namespace_id = "2026080801"

[ratelimits.simple]
limit = 60
period = 60
