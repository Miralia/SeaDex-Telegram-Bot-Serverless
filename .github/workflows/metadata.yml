name: Build Metadata

on:
  push:
    paths:
      - data/missing_anilist_ids.json
      - data/known_relations.json
  workflow_dispatch:
    inputs:
      anilist_mode:
        description: "Metadata refresh mode for current SeaDex entry IDs"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - known
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 4 1 * *"

concurrency:
  group: metadata-build
  cancel-in-progress: false

jobs:
  build-and-import:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: .metadata-state.json
          key: metadata-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            metadata-state-${{ github.ref_name }}-
      - run: npm ci
      - name: Build metadata
        env:
          ANILIST_MODE_INPUT: ${{ inputs.anilist_mode || 'incremental' }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          MODE="$ANILIST_MODE_INPUT"
          if [ "$EVENT_SCHEDULE" = "17 4 1 * *" ]; then MODE=known; fi
          npm run build:metadata -- --anilist-mode "$MODE" --state .metadata-state.json
      - name: Apply metadata to D1
        env:
          D1_DATABASE: ${{ vars.METADATA_D1_DATABASE }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$D1_DATABASE"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          bash scripts/prepare-wrangler-config.sh "$GITHUB_WORKSPACE/.wrangler/seadex-wrangler.toml"
          npx wrangler d1 execute "$D1_DATABASE" \
            --config "$GITHUB_WORKSPACE/.wrangler/seadex-wrangler.toml" \
            --remote \
            --file artifacts/metadata.sql
      - name: Persist resolved missing IDs
        if: success()
        run: |
          if git diff --quiet -- data/missing_anilist_ids.json; then exit 0; fi
          git config user.name "seadex-metadata[bot]"
          git config user.email "seadex-metadata[bot]@users.noreply.github.com"
          git add data/missing_anilist_ids.json
          git commit -m "chore(metadata): prune resolved missing IDs"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: .metadata-state.json
          key: metadata-state-${{ github.ref_name }}-${{ github.run_id }}
