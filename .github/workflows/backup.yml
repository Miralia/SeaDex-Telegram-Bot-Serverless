name: Backup D1

# Time Travel already covers the last 30 days inside Cloudflare. This workflow
# keeps an offline copy that also survives losing the database, the account or
# the 30 day window, and proves on every run that the copy restores.

on:
  schedule:
    # Quiet hour: before the metadata build at 03:17 UTC.
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: d1-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      D1_DATABASE: ${{ vars.METADATA_D1_DATABASE || 'seadex' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Both destinations are optional; the artifact below always exists.
      TELEGRAM_BACKUP_CHAT: ${{ vars.BACKUP_TELEGRAM_CHAT }}
      R2_BACKUP_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Back up the database
        run: ./scripts/backup-d1.sh backups

      - name: Restore the backup and compare row counts
        run: |
          command -v sqlite3 >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sqlite3
          }
          ./scripts/restore-d1.sh --verify "$(ls backups/*.sql.gz)"

      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_number }}
          path: |
            backups/*.sql.gz
            backups/*.sql.gz.sha256
            backups/*.sql.gz.manifest.json
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### D1 backup"
            echo
            for manifest in backups/*.manifest.json; do
              [ -f "$manifest" ] || continue
              node -e '
                const fs = require("fs")
                const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
                console.log(`- archive: \`${m.archive}\``)
                console.log(`- sha256: \`${m.sha256}\``)
                console.log(`- time travel bookmark: \`${m.time_travel_bookmark}\``)
                console.log("- rows: " + Object.entries(m.row_counts).map(([t, n]) => `${t}=${n}`).join(", "))
              ' "$manifest"
            done
          } >> "$GITHUB_STEP_SUMMARY"
